name: Release

on:
  push:
    branches:
      - main
  create:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            platform: win
            asset_name: Battlezone98Redux_AudioTool-win
            pyinstaller_output: dist/BZAudioTool.exe
          - os: ubuntu-latest
            platform: linux
            asset_name: Battlezone98Redux_AudioTool-linux
            pyinstaller_output: dist/BZAudioTool
          - os: macos-latest
            platform: mac
            asset_name: Battlezone98Redux_AudioTool-mac
            pyinstaller_output: dist/BZAudioTool.app

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Resolve package version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          version="${tag#v}"
          if [[ -z "$version" ]]; then
            version="0.0.0"
          fi
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install FFMPEG (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $ffmpegZip = "ffmpeg.zip"
        Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
        Expand-Archive -Path $ffmpegZip -DestinationPath .
        $ffmpegPath = (Get-ChildItem -Path . -Filter "ffmpeg-*-essentials_build" -Directory).FullName
        Add-Content $env:GITHUB_PATH "$ffmpegPath\bin"
      shell: powershell

    - name: Install FFMPEG (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install FFMPEG (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pillow

    - name: Generate canonical app icon
      run: |
        python scripts/generate_app_icon.py branding/repo_icon.svg branding/app_icon.ico --png branding/app_icon.png

    - name: Generate Windows version metadata
      if: matrix.os == 'windows-latest'
      run: |
        python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: pyinstaller audio.py --name BZAudioTool --onefile --windowed --icon "branding/app_icon.ico" --version-file "branding/version_info.txt" --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" --add-data "BZONE.ttf:." --add-data "commbeep.wav:." --add-data "unitbeep.wav:." --add-data "LICENSE:." --runtime-hook branding/pyinstaller_icon_hook.py

    - name: Build with PyInstaller (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: pyinstaller audio.py --name BZAudioTool --onefile --windowed --icon "branding/app_icon.ico" --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" --add-data "BZONE.ttf:." --add-data "commbeep.wav:." --add-data "unitbeep.wav:." --add-data "LICENSE:." --runtime-hook branding/pyinstaller_icon_hook.py

    - name: Package Application (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path ${{ matrix.pyinstaller_output }} -DestinationPath "Battlezone98Redux_AudioTool-v${{ steps.version.outputs.version }}-win.zip"
      shell: powershell

    - name: Package Application (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        tar -czvf "Battlezone98Redux_AudioTool-v${{ steps.version.outputs.version }}-linux.tar.gz" -C dist BZAudioTool

    - name: Package Application (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        zip -r "Battlezone98Redux_AudioTool-v${{ steps.version.outputs.version }}-mac.zip" ${{ matrix.pyinstaller_output }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: Battlezone98Redux_AudioTool-v*-${{ matrix.platform }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
